<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro tigger</title>
</head>

<body>

    <h1>faça cadastro na tigger</h1>

    <a href="index.html">Voltar para a Página Inicial</a>

    <hr>

    <form>

        <label for="nome">Nome Completo:</label><br>
        <input type="text" id="nome" name="nome"><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" name="senha"><br><br>

        <label>Nível do Cliente:</label><br>

        <input type="radio" id="comum" name="cliente" value="comum">
        <label for="comum">Cliente Comum</label><br>

        <input type="radio" id="empresa" name="cliente" value="empresa">
        <label for="empresa">Empresa (CNPJ)</label><br><br>

        <label for="interesse">Área de Interesse:</label><br>

        <select id="interesse" name="interesse">
            <option>basquete</option>
            <option>futebol</option>
            <option>volei</option>
            <option>outro</option>
        </select>

        <br><br>

        <button type="submit">Cadastrar</button>

    </form>

</body>
</html>
